services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_AI: ${INSTALL_AI:-false}
    restart: unless-stopped
    environment:
      QWEN_ENVIRONMENT: production
      QWEN_SECRET_KEY: ${QWEN_SECRET_KEY:?Run openssl rand -base64 48 and set QWEN_SECRET_KEY}
      QWEN_BOOTSTRAP_TOKEN: ${QWEN_BOOTSTRAP_TOKEN:-}
      QWEN_COOKIE_SECURE: ${QWEN_COOKIE_SECURE:-false}
      QWEN_ALLOWED_HOSTS: ${QWEN_ALLOWED_HOSTS:-localhost,127.0.0.1}
      QWEN_CORS_ORIGINS: ${QWEN_CORS_ORIGINS:-}
      QWEN_AI_ENABLED: ${QWEN_AI_ENABLED:-false}
    volumes:
      - qwen-data:/app/data
      - ./models:/app/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    profiles: [production]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /var/cache/nginx:size=64m
      - /var/run:size=16m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  qwen-data:
